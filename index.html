<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F0E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="品飲筆記">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400;500&display=swap">
<title>WSET 品飲筆記</title>
<style>
/* 酒莊紙感風（v3，2026-10-07；獨立 App，不掛任何公司標示）
   字型：Noto Sans TC 單一家族（中英共用，離線退回系統字型）；字級走 12.8 / 16 / 20 / 25 級數；字重依字級（<20px Regular、20px+ Light、強調 Medium），不用 Bold、不用 Thin。
   色彩：淺色＝奶油白紙底 #F6F0E1、深酒紅 #5A1F2B、葡萄葉綠、細金線；深色＝深酒紅黑 #1A0F12 搭暖白字 #F1E8D8。
   功能色：莫蘭迪四色，各自只對應一種功能——灰綠＝相同／完成、土黃＝提醒／不同／不確定、灰藍＝說明、磚紅＝刪除／警告。
   版面：手機單欄，桌面（>=900px）表單雙欄；底部分頁列（桌面移到頂端）。 */
:root{
  /* 酒莊紙感（淺色）：奶油白紙底、深酒紅、葡萄葉綠、細金線 */
  --bg:#F6F0E1; --surface:#FBF7EC; --surface2:#EDE4CE; --fg:#2A2118; --muted:#66594A; --line:#D8CCAE; --ctl:#857760;
  --gold:#BEA578; --gold-ink:#8A733F; --star:#A9741A; --accent:#5A1F2B; --sel:#EED8D2; --accent-fg:#F6EFE2; --btn:#5A1F2B;
  --wine:#5A1F2B; --wine-bd:#5A1F2B; --wine-tx:#5A1F2B; --wine-bar:#7A2E3C; --wine-soft:#EED8D2; --wine-fill:#E5C6C4;
  --ok:#6F7D4A; --ok-soft:#E8EBD6; --ok-fg:#46532A;
  --warn:#B08A3E; --warn-soft:#F5ECD2; --warn-fg:#6B4F12;
  --info:#6F8196; --info-soft:#E6ECF1; --info-fg:#3F5266;
  --danger:#A8574C; --danger-soft:#F4E1DC; --danger-fg:#7F362D;
  --gray-soft:#EDE4CE; --gray:#66594A;
  --q-top:#CFDDA6; --q-top-fg:#2F3B16; --q-good:#E8EBD6; --q-mid:#EDE4CE; --q-var:#F5ECD2; --q-weak:#F4E1DC;
  --c-vis:#7C5416; --c-vis-soft:#F3E7C8; --c-nose:#46532A; --c-nose-soft:#E8EBD6; --c-taste:#6E1F30; --c-taste-soft:#F2DDDD; --c-end:#3F5266; --c-end-soft:#E4EAF0;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  --tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='a'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .32 0 0 0 0 .18 0 0 0 .08 0'/></filter><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012 .35' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .38 0 0 0 0 .2 0 0 0 .09 0'/></filter><rect width='200' height='200' filter='url(%23a)'/><rect width='200' height='200' filter='url(%23b)'/></svg>");
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --q-top:#2C3A18; --q-top-fg:#D3E0A8; --q-good:#232B15; --q-mid:#2F1C21; --q-var:#2A2214; --q-weak:#3A1C1A;
    /* 深酒紅黑：不是純黑，帶一點酒紅的暗色底，搭暖白字 */
    --bg:#1A0F12; --surface:#241519; --surface2:#2F1C21; --fg:#F1E8D8; --muted:#B8A794; --line:#46292F; --ctl:#947680;
    --gold:#C8AE7C; --gold-ink:#C8AE7C; --star:#D9B25A; --accent:#E8B0B8; --sel:#3C1B24; --accent-fg:#F6EFE2; --btn:#6B2433;
    --wine:#6B2433; --wine-bd:#B5627A; --wine-tx:#EDB8C0; --wine-bar:#C9708A; --wine-soft:#3C1B24; --wine-fill:#5C2333;
    --ok:#8E9F62; --ok-soft:#1F2415; --ok-fg:#BCCB92;
    --warn:#B8964A; --warn-soft:#2A2214; --warn-fg:#E2C27A;
    --info:#7F95AB; --info-soft:#18222C; --info-fg:#A9BCD0;
    --danger:#C2685B; --danger-soft:#3A1C1A; --danger-fg:#EBA79C;
    --gray-soft:#2F1C21; --gray:#B8A794; color-scheme:dark;
    --c-vis:#E2C27A; --c-vis-soft:#2A2214; --c-nose:#BCCB92; --c-nose-soft:#1F2415; --c-taste:#EDB8C0; --c-taste-soft:#3C1B24; --c-end:#A9BCD0; --c-end-soft:#18222C;
    --tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='a'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .85 0 0 0 0 .7 0 0 0 0 .55 0 0 0 .06 0'/></filter><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012 .35' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9 0 0 0 0 .75 0 0 0 0 .6 0 0 0 .07 0'/></filter><rect width='200' height='200' filter='url(%23a)'/><rect width='200' height='200' filter='url(%23b)'/></svg>");
  }
}
:root[data-theme="dark"]{
  --q-top:#2C3A18; --q-top-fg:#D3E0A8; --q-good:#232B15; --q-mid:#2F1C21; --q-var:#2A2214; --q-weak:#3A1C1A;
  --bg:#1A0F12; --surface:#241519; --surface2:#2F1C21; --fg:#F1E8D8; --muted:#B8A794; --line:#46292F; --ctl:#947680;
  --gold:#C8AE7C; --gold-ink:#C8AE7C; --star:#D9B25A; --accent:#E8B0B8; --sel:#3C1B24; --accent-fg:#F6EFE2; --btn:#6B2433;
  --wine:#6B2433; --wine-bd:#B5627A; --wine-tx:#EDB8C0; --wine-bar:#C9708A; --wine-soft:#3C1B24; --wine-fill:#5C2333;
  --ok:#8E9F62; --ok-soft:#1F2415; --ok-fg:#BCCB92;
  --warn:#B8964A; --warn-soft:#2A2214; --warn-fg:#E2C27A;
  --info:#7F95AB; --info-soft:#18222C; --info-fg:#A9BCD0;
  --danger:#C2685B; --danger-soft:#3A1C1A; --danger-fg:#EBA79C;
  --gray-soft:#2F1C21; --gray:#B8A794; color-scheme:dark;
  --c-vis:#E2C27A; --c-vis-soft:#2A2214; --c-nose:#BCCB92; --c-nose-soft:#1F2415; --c-taste:#EDB8C0; --c-taste-soft:#3C1B24; --c-end:#A9BCD0; --c-end-soft:#18222C;
  --tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='a'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .85 0 0 0 0 .7 0 0 0 0 .55 0 0 0 .06 0'/></filter><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012 .35' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9 0 0 0 0 .75 0 0 0 0 .6 0 0 0 .07 0'/></filter><rect width='200' height='200' filter='url(%23a)'/><rect width='200' height='200' filter='url(%23b)'/></svg>");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) var(--tex);color:var(--fg);font-family:var(--font);font-size:1rem;font-weight:400;line-height:1.6;
  padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font);margin:0;line-height:1.35;text-wrap:balance;font-weight:300}
h2{font-size:1.25rem;letter-spacing:.06em} h3{font-size:1rem;font-weight:500}
b,strong{font-weight:500}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin-inline:auto}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.prose,.note,.regioncard,.rcard dl{line-height:1.85}

/* header + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--gold)}
.top .row{display:flex;align-items:center;gap:12px;max-width:1100px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;min-width:0}
.brand .art{color:var(--gold)}
.brand .ttl{font-size:1rem;letter-spacing:.15em;padding-left:12px;border-left:1px solid var(--gold);line-height:1.2}
.top .sp{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;min-height:52px;border:0;background:none;border-radius:0;color:var(--muted);font-size:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--fg);font-weight:500}
.tabs button.on::before{content:"";position:absolute;left:25%;right:25%;top:-5px;height:2px;background:var(--gold)}
@media (min-width:900px){
  body{padding-block:0 40px}
  .tabs{position:static;border:0;background:none;padding:0;gap:4px}
  .tabs button{flex-direction:row;min-height:44px;padding:0 14px;font-size:1rem;gap:6px}
  .tabs button.on::before{left:14px;right:14px;top:auto;bottom:2px}
  .top .row{flex-wrap:nowrap}
}
@media (max-width:420px){.brand .ttl{letter-spacing:.08em}}
main{padding-block:18px;max-width:1100px;margin-inline:auto}

/* buttons */
.btn{min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--ctl);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);font-weight:400}
.btn.primary{background:var(--wine);color:#F3F0EA;border-color:var(--wine-bd);font-weight:500}
.btn.danger{color:var(--danger-fg);border-color:var(--danger)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:44px;padding:0 12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* cards & sections */
.card{background:var(--surface) var(--tex);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{background:var(--surface) var(--tex);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec > h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--gold)}
.sec > h2 small{font-family:var(--font);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2f{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .grid2f{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-areas:"a b" "c b";align-items:start}
  .area-a{grid-area:a}.area-b{grid-area:b}.area-c{grid-area:c}
}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp > .lbl{font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:.08em}
.sub{display:flex;align-items:center;gap:8px;font-size:1rem;letter-spacing:.2em;font-weight:500;padding:6px 10px;margin-top:6px;border-radius:var(--r);border-left:3px solid currentColor}
.sub .art{color:inherit}
.sub.s-vis{color:var(--c-vis);background:var(--c-vis-soft)}.sub.s-nose{color:var(--c-nose);background:var(--c-nose-soft)}
.sub.s-taste{color:var(--c-taste);background:var(--c-taste-soft)}.sub.s-end{color:var(--c-end);background:var(--c-end-soft)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr))}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:.04em;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--ctl);border-radius:var(--r);background:var(--bg);color:var(--fg);font-weight:400}
input[type=file]{min-height:44px;max-width:100%}
textarea{min-height:76px;resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}

/* single-choice：選中＝低彩度底＋金色細線，不用大面積金色 */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;min-height:48px;border:1px solid var(--ctl);background:var(--bg);border-radius:var(--r);cursor:pointer;font-weight:400;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.25;position:relative}
.seg.wrapb button{flex:1 1 calc(33% - 6px)}
.seg button.on{background:var(--sel);border-color:var(--gold);color:var(--fg);font-weight:500;box-shadow:inset 0 -3px 0 var(--gold)}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.55);flex:none;vertical-align:-3px;background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.32),transparent 52%)}
.kv dd .sw,.cmp td .sw{margin-right:6px}
.seg.mode button{min-height:44px;min-width:56px}
@media (max-width:480px){.seg.wrapb button{flex:1 1 calc(50% - 6px)}}
/* multi-choice */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--ctl);background:var(--bg);cursor:pointer;font-size:1rem;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--sel);border-color:var(--gold);color:var(--fg);font-weight:500}
.chip.on::before{content:"✓";color:var(--wine-tx);font-size:.8rem}
.chip.static{cursor:default;min-height:30px;padding:2px 10px;font-size:.8rem;border-color:var(--line)}
.chip.static::before{content:none}
.chip.same{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-fg)}
.chip.mine{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-fg)}
details.lay{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
details.lay > summary{min-height:44px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:400;list-style:none}
details.lay > summary::-webkit-details-marker{display:none}
details.lay > summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.lay[open] > summary::before{transform:rotate(90deg)}
details.lay .body{padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px}
.badge{background:var(--sel);color:var(--wine-tx);border:1px solid var(--gold);border-radius:999px;font-size:.8rem;padding:0 8px;min-width:24px;text-align:center;font-weight:500}
.gl{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:500;margin-bottom:4px;letter-spacing:.04em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.chip .dot{margin-right:2px}
.chip.on .dot{display:none}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:var(--surface2);color:var(--fg);font-weight:500;font-size:.8rem;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.pill.wine{background:var(--wine-soft);color:var(--wine-tx);border-color:var(--wine-bd)}
.pill.prog{background:linear-gradient(90deg,var(--wine-fill) var(--p,0%),var(--surface2) var(--p,0%))}
.pill.gray{background:var(--gray-soft);color:var(--gray)}
.pill.ok{background:var(--ok-soft);color:var(--ok-fg);border-color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn-fg);border-color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info-fg);border-color:var(--info)}
.reason{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.reason .chip{min-width:110px;justify-content:center}
.stars{display:flex;gap:2px}
.stars button{width:44px;height:44px;border:0;background:none;font-size:1.5625rem;cursor:pointer;color:var(--ctl);line-height:1;padding:0}
.stars button.on{color:var(--star)}
.starsro{color:var(--star);letter-spacing:2px;white-space:nowrap}
.starsro .off{color:var(--line)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--fg);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;font-size:1rem}
.note.info{border-color:var(--info);background:var(--info-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.err{border-color:var(--danger);background:var(--danger-soft)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:var(--r);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.banner .sp{flex:1;min-width:160px}

/* progress */
.formtop{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin:0 -16px 14px;background:var(--bg);padding:6px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:15;border-bottom:1px solid var(--line)}
.formtop .ttl,.formtop .saved{display:none}
.formtop .seg{flex:none;flex-wrap:nowrap}
.formtop .seg button{min-width:48px;flex:none;padding:6px 8px}
@media (min-width:600px){.formtop{flex-wrap:wrap}.formtop .ttl,.formtop .saved{display:inline}}
.formtop .ttl{font-weight:300;font-size:1.25rem;letter-spacing:.06em;white-space:nowrap}
.formtop .sp{flex:1;min-width:0}
.saved{font-size:.8rem;color:var(--muted)}

/* wine list */
.filters{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-bottom:14px}
.filters .search{grid-column:1/-1}
details.fl{margin-bottom:14px}
details.fl > summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;padding:0 12px;border:1px solid var(--ctl);border-radius:var(--r);background:var(--surface)}
details.fl > summary::-webkit-details-marker{display:none}
details.fl > summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.fl[open] > summary::before{transform:rotate(90deg)}
details.fl .filters{margin:10px 0 0}
.filters .dates{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.wcard{display:flex;gap:12px;background:var(--surface) var(--tex);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;min-width:0;width:100%;min-height:96px}
.wcard:hover{border-color:var(--gold)}
.thumb .art{opacity:.85}
.thumb{width:76px;height:96px;flex:none;border-radius:8px;background:var(--surface2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.wcard .info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.wcard .nm{font-weight:500;overflow-wrap:anywhere}
.wcard .meta{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--wine-bar)}
.art{display:inline-flex;color:var(--gold-ink);line-height:0;flex:none}
.art.mute{color:var(--muted)}
.art svg{display:block}
.pagehd{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.pagehd h2{flex:1}
.refhd{display:flex;align-items:center;gap:14px;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.refhd .tx{display:flex;flex-direction:column;gap:2px}
.wcard{border-left:4px solid var(--line)}
.wcard.t-white{border-left-color:#BFAF5E}.wcard.t-rose{border-left-color:#E2A58A}.wcard.t-red{border-left-color:#8E1B33}
.wcard.t-sparkling{border-left:4px dotted #D8C49A}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;display:flex;flex-direction:column;gap:4px}
.ph .im{aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--surface2);cursor:zoom-in;border:0;padding:0}
.ph .im img{width:100%;height:100%;object-fit:cover;display:block}
.ph select{min-height:44px;font-size:.8rem;padding:4px 6px}
.ph .x{position:absolute;top:4px;right:4px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;cursor:pointer;font-size:1.25rem;transform:scale(.75);transform-origin:top right}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:48px;height:48px;border-radius:50%;border:0;font-size:1.25rem;cursor:pointer}

/* detail */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.kv dt{color:var(--muted);font-size:.8rem;font-weight:500;padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:1rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.8rem;color:var(--muted);letter-spacing:.08em;font-weight:500}
.cmp{table-layout:fixed}
.cmp th:nth-child(1),.cmp td:nth-child(1){width:26%}
.cmp th:nth-child(4),.cmp td:nth-child(4){width:19%}
.cmp td{overflow-wrap:anywhere}
.cmp td.s{font-size:.8rem;font-weight:500;white-space:nowrap}
.cmp tr td:first-child{border-left:3px solid transparent}
.cmp tr.same td:first-child{border-left-color:var(--ok)}
.cmp tr.diff td:first-child{border-left-color:var(--warn)}
.cmp tr.same td{background:var(--ok-soft)}
.cmp tr.same td.s{color:var(--ok-fg)}
.cmp tr.diff td{background:var(--warn-soft)}
.cmp tr.diff td.s{color:var(--warn-fg)}
.cmp tr.one td{background:var(--gray-soft)}
.cmp td{color:var(--fg)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.hitbar{display:grid;grid-template-columns:90px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:1rem}
.hitbar .bar{height:8px}
.lookup{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.regioncard{border:1px solid var(--info);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--info-soft)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* reference */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.subtabs button{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--ctl);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:400}
.subtabs button.on{background:var(--sel);color:var(--fg);border-color:var(--gold);font-weight:500;box-shadow:inset 0 -2px 0 var(--gold)}
.rgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.rcard{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.rcard b{font-size:1rem;font-weight:500}
.rcard .c{font-size:.8rem;color:var(--accent);font-weight:500;letter-spacing:.12em}
.rcard dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:1rem}
.rcard dt{color:var(--muted)} .rcard dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:200;font-size:1rem;max-width:90vw}
.toast.mini{pointer-events:none;font-size:.8rem;padding:4px 14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));opacity:0;animation:minifade 1.5s ease-out}
@keyframes minifade{0%{opacity:0}12%{opacity:.92}70%{opacity:.92}100%{opacity:0}}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;min-height:120px;line-height:1.6}

/* 圖章式標籤（這杯的心情） */
.stamps{display:flex;flex-wrap:wrap;gap:8px}
.stamp{min-height:44px;padding:6px 14px;border:1.5px dashed var(--ctl);border-radius:8px;background:var(--bg);cursor:pointer;color:var(--fg);letter-spacing:.12em;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.stamp.on{border:1.5px solid var(--wine-bd);background:var(--wine-soft);color:var(--wine-tx);font-weight:500;transform:rotate(-1.2deg);box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px var(--wine-bd)}
.stamp.on::before{content:"✓";font-size:.8rem}
.stamp.static{min-height:30px;padding:2px 10px;font-size:.8rem;cursor:default;transform:none}
.stamp.static::before{content:none}

/* AI 酒標辨識 */
.ai{border:1px solid var(--gold);border-radius:var(--r);background:var(--bg)}
.ai > summary{min-height:48px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;list-style:none;font-weight:500}
.ai > summary::-webkit-details-marker{display:none}
.ai > summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.ai[open] > summary .chev{transform:rotate(90deg)}
.ai > summary svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ai .aibody{padding:4px 12px 14px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps > li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.steps .n{width:28px;height:28px;border-radius:50%;border:1px solid var(--info);background:var(--info-soft);color:var(--info-fg);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500;margin-top:2px}
.steps .t{display:flex;flex-direction:column;gap:8px;min-width:0}
.steps .t > .h{font-weight:500}
.prev{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:start;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow input[type=checkbox]{width:24px;height:24px;margin:10px;accent-color:var(--accent)}
.prow .pc{padding:8px 8px 8px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .pk{font-size:.8rem;color:var(--muted);letter-spacing:.06em;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .pv{overflow-wrap:anywhere}
.prow .po{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.prow.unsure{background:var(--warn-soft)}
.prow.same{opacity:.7;cursor:default}
/* 第三輪：L3 刻度、L3 詞彙、年份天氣、年份參考表 */
.seg.five button{min-width:0;padding:6px 2px;flex:1 1 0}
.seg.two2 button{flex:1 1 calc(50% - 6px)}
.chip.l3{border-style:dashed}
.chip.l3.on{border-style:solid}
.l3blk{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:8px 10px;border:1px dashed var(--ctl);border-radius:var(--r)}
.l3blk .l3h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;border:1px solid var(--ctl);background:var(--bg);border-radius:var(--r);padding:6px 12px;cursor:pointer}
.tog .knob{flex:none;width:40px;height:24px;border-radius:999px;border:1px solid var(--ctl);background:var(--surface2);position:relative;transition:background .15s}
.tog .knob::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tog[aria-checked="true"]{border-color:var(--gold);background:var(--sel)}
.tog[aria-checked="true"] .knob{background:var(--wine);border-color:var(--wine-bd)}
.tog[aria-checked="true"] .knob::after{transform:translateX(16px);background:#F3F0EA}
.tog .tl{flex:1;min-width:0;line-height:1.35}
.tog .tl small{display:block;color:var(--muted);font-size:.8rem}
.seeded{font-size:.8rem;color:var(--warn-fg);font-weight:400;letter-spacing:0}
.vwhint{display:flex;flex-direction:column;gap:2px}
.vwhint ul{margin:4px 0 0;padding-left:1.2em}
.vm{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.vm table{border-collapse:separate;border-spacing:0;font-size:.8rem}
.vm th,.vm td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.vm thead th{position:sticky;top:0;background:var(--surface2);font-weight:500;min-width:46px;height:36px;z-index:1}
.vm th.rn,.vm td.rn{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;min-width:118px;max-width:118px;padding:0 8px;font-weight:500;border-right:1px solid var(--gold)}
.vm thead th.rn{background:var(--surface2);z-index:3}
.vm td.rn button{all:unset;display:block;box-sizing:border-box;width:100%;min-height:44px;line-height:1.3;padding:5px 0;cursor:pointer;font-size:.8rem}
.vm td.rn button small{display:block;color:var(--muted);font-weight:400}
.vm td.c button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:46px;min-height:44px;cursor:pointer;font-size:.8rem;font-weight:500;position:relative}
.vm td.c button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.vm td.sel button{box-shadow:inset 0 0 0 2px var(--gold)}
.q-top{background:var(--q-top);color:var(--q-top-fg)}.q-good{background:var(--q-good)}.q-mid{background:var(--q-mid)}.q-var{background:var(--q-var)}.q-weak{background:var(--q-weak)}.q-none{background:transparent;color:var(--muted)}
.vm .mod::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--wine-bar)}
.vrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .yr{font-size:1.25rem;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.3}
.vrow .vb{display:flex;flex-direction:column;gap:6px;min-width:0}
.vrow.hl{background:var(--sel);margin-inline:-8px;padding-inline:8px;border-radius:var(--r)}
.pill.q-top,.pill.q-good,.pill.q-mid,.pill.q-var,.pill.q-weak{border-color:var(--line);color:var(--fg)}
.pill.q-top{color:var(--q-top-fg)}
.srcs{margin:0;padding-left:1.2em;font-size:.8rem}
.srcs li{overflow-wrap:anywhere;padding:4px 0}
.autotag{margin-left:8px;font-size:.8rem;color:var(--info-fg);font-weight:400;letter-spacing:0}
.vwsum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0}
#vwd > summary{padding-block:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:reduce){.toast.mini{opacity:.92}}
/*MAP4CSS_START*/
/* 第四輪：產區地圖 */
:root{--map-sea:#DDE1D2;--map-land:#FBF7EC;--map-bd:#B9A981;--map-band:rgba(122,46,60,.10);--map-lat:#8D7C55;--map-hl:#EBD2B4;
  --k-cm:#3F7FA6;--k-cc:#7863A8;--k-wm:#5E8A4E;--k-md:#C58A2B;--k-hh:#B5523B;--k-sb:#C0587E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map-sea:#110A0D;--map-land:#46303A;--map-bd:#85606B;--map-band:rgba(205,120,140,.14);--map-lat:#9C8660;--map-hl:#5A4330;
  --k-cm:#6FA9CE;--k-cc:#A592D6;--k-wm:#8DBA7B;--k-md:#E3B15A;--k-hh:#DB8470;--k-sb:#E48DAF}}
:root[data-theme="dark"]{--map-sea:#110A0D;--map-land:#46303A;--map-bd:#85606B;--map-band:rgba(205,120,140,.14);--map-lat:#9C8660;--map-hl:#5A4330;
  --k-cm:#6FA9CE;--k-cc:#A592D6;--k-wm:#8DBA7B;--k-md:#E3B15A;--k-hh:#DB8470;--k-sb:#E48DAF}
#WL{fill:var(--map-land);stroke:var(--map-bd);stroke-width:.7;stroke-linejoin:round;fill-rule:evenodd}
.m-hl{fill:var(--map-hl);stroke:var(--wine-bd);stroke-width:1.5;stroke-linejoin:round;fill-rule:evenodd}
.m-sea{fill:var(--map-sea)}
.m-band{fill:var(--map-band)}
.m-lon{stroke:var(--map-lat);stroke-width:.5;opacity:.25}
.m-lat{stroke:var(--map-lat);stroke-width:.5;opacity:.4}
.m-lat10{stroke-width:.7;opacity:.55}
.m-eq{stroke:var(--gold-ink);stroke-width:1.1;opacity:.85}
.m-trop{stroke:var(--gold-ink);stroke-width:.9;stroke-dasharray:5 4;opacity:.65}
.m-ll,.m-bl,.m-tx,.m-ct{paint-order:stroke;stroke-linejoin:round;stroke:var(--map-sea);stroke-width:3px;stroke-opacity:.85;font-family:var(--font)}
.m-ll{fill:var(--muted);font-weight:500}
.m-tl{fill:var(--gold-ink)}
.m-bl{fill:var(--wine-tx);opacity:.8}
.m-sel-lat{stroke:var(--wine-bd);stroke-width:1.3;stroke-dasharray:6 4}
.m-pill rect{fill:var(--wine)}
.m-pill text{fill:#F3F0EA;font-weight:500;font-family:var(--font)}
.m-pt{stroke:var(--surface);stroke-width:1.4;cursor:pointer}
.m-pt.l2{fill:var(--wine-bar)}
.m-pt.hollow{fill:var(--surface);stroke:var(--wine-bd);stroke-width:2}
.m-pt.clim{stroke:var(--surface);stroke-width:1.6}
.m-pt.clim.l2{stroke:var(--fg)}
.m-pt.gm{fill:var(--wine-bar)}
.m-pt.gd{fill:var(--ctl);opacity:.5;stroke:none}
.m-glow{fill:var(--gold);opacity:.3}
.m-ring{fill:none;stroke:var(--gold);stroke-width:2.4}
.m-selring{fill:none;stroke:var(--fg);stroke-width:1.8}
.m-tx{fill:var(--fg);font-weight:500;stroke:var(--map-land)}
.m-tx.sel{fill:var(--wine-tx)}
.m-tx.lit{fill:var(--gold-ink)}
.m-ct{fill:var(--muted);opacity:.9;font-weight:400;letter-spacing:.06em}
.m-ct.hl{fill:var(--wine-tx);opacity:1;font-weight:500}
.mapwrap{display:flex;justify-content:center;width:100%}
.mapbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--map-sea);max-width:100%;min-height:80px}
.mapbox svg{display:block;max-width:100%;height:auto;touch-action:manipulation}
.minimap{cursor:pointer;border-radius:var(--r)}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.lg{display:inline-flex;gap:6px;align-items:center}
.lgdot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.lgdot.big{background:var(--wine-bar)}
.lgdot.sm{width:7px;height:7px;background:var(--ctl);opacity:.6}
.lgdot.hol{border:2px solid var(--wine-bd);background:var(--surface)}
.lgdot.lit{background:transparent;border:2.5px solid var(--gold);box-shadow:0 0 0 3px rgba(190,165,120,.3)}
.lgband{display:inline-block;width:22px;height:10px;background:var(--map-band);border:1px solid var(--map-lat);flex:none}
.kcchip{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.kcsw{flex:none}
.chip.mini{min-height:44px;padding:4px 12px;font-size:.9rem}
.chip.drunk{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.chip .cnt{color:var(--gold-ink);font-weight:500}
.chip.l2{font-weight:500}
.mapcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.mc-hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mc-t{font-size:1.1rem;font-weight:500;overflow-wrap:anywhere}
.mapwines{margin-top:4px}
.wrow{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;width:100%}
.wrow .wn{font-weight:500;overflow-wrap:anywhere}
.mlist-c{display:flex;flex-direction:column;gap:2px}
.mlist-c .cn{font-size:.8rem;color:var(--accent);letter-spacing:.12em;font-weight:500}
.mapfr{margin-bottom:0}
.nearfr{align-items:stretch}
#mapDetail .kv{margin-top:4px}
/*MAP4CSS_END*/
.vline{font-size:.78rem;line-height:1.5;color:var(--fg);overflow-wrap:anywhere}
.vline .vy{font-weight:500;font-variant-numeric:tabular-nums}
.vline .vsep{color:var(--ctl);margin:0 3px 0 1px}
.vline .vgp{white-space:nowrap}
.qsw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--ctl);margin-right:5px;vertical-align:-1px}
.vline.ref{color:var(--muted)}
.vline.ref .vy{font-weight:400}
.vline.ref .qsw{border-style:dashed}
.vline .vyw{white-space:nowrap}
.vline .vtag{display:inline-block;margin-left:4px;padding:0 5px;font-size:.7rem;line-height:1.4;border:1px dashed var(--ctl);border-radius:999px;color:var(--muted);white-space:nowrap}
.vblock{gap:12px}
.vfeel{border:1px solid var(--gold);border-radius:var(--r);background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vfeel.cmp{border-style:dashed}
.vf-hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vf-y{font-size:2rem;font-weight:300;letter-spacing:.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.vf-meta{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.vf-n{font-size:.8rem;color:var(--muted);letter-spacing:.06em;overflow-wrap:anywhere}
.vf-big{margin:0;font-size:1.25rem;font-weight:300;line-height:1.7;letter-spacing:.03em;overflow-wrap:anywhere}
.vf-small{margin:0}
.vf-cmpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:6px 10px;font-size:.8rem}
.vstrip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch;max-width:100%}
.vcell{flex:none;width:58px;min-height:80px;border:1px solid var(--ctl);background:var(--bg);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;cursor:pointer;font-size:.8rem;line-height:1.2}
.vcell .vc-y{font-weight:500;font-variant-numeric:tabular-nums}
.vcell .vc-q{width:34px;min-height:22px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:500}
.vcell .vc-t{font-size:.7rem;color:var(--muted);text-align:center;min-height:1.2em}
.vcell .vc-cur{font-size:.7rem;color:var(--wine-tx);font-weight:500}
.vcell.cur{border:2px solid var(--wine-bd)}
.vcell.sel{background:var(--sel);box-shadow:inset 0 -3px 0 var(--gold)}
.vwwhy{gap:10px}
#vwd > summary{flex-wrap:wrap;row-gap:4px}
.vwt{font-weight:400;flex:1 1 70%}
#vwd > summary .vwsum{flex:1 1 100%;padding-left:20px}
.vctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vctl .seg{flex:1 1 220px}
.vwines{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.hwdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);border:1px solid var(--wine-bd);margin-right:5px}
.vm td.c.hw button::before{content:"";position:absolute;left:4px;bottom:4px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:1px solid var(--wine-bd)}
</style>

<body>

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

/* ========= 儲存層：IndexedDB，失敗退回記憶體 ========= */
const Store = {
  mode: 'idb', db: null, err: null, failed: false,
  mem: { wines: new Map(), photos: new Map(), meta: new Map() },
  async init() {
    try {
      if (!window.indexedDB) throw new Error('此環境沒有 IndexedDB');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('wset-notes', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('wines', { keyPath: 'id' });
          d.createObjectStore('photos', { keyPath: 'id' });
          d.createObjectStore('meta', { keyPath: 'k' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('開啟資料庫失敗'));
        r.onblocked = () => rej(new Error('資料庫被占用'));
        setTimeout(() => rej(new Error('資料庫逾時')), 4000);
      });
    } catch (e) { this.mode = 'mem'; this.err = e; }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      let out; const rq = fn(t.objectStore(store));
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('交易中止'));
    });
  },
  _key: v => v.id != null ? v.id : v.k,
  async put(store, v) {
    if (this.mode === 'mem') { this.mem[store].set(this._key(v), v); return; }
    try { await this._tx(store, 'readwrite', os => os.put(v)); }
    catch (e) { this.failed = true; this.err = e; this.mem[store].set(this._key(v), v); toast('沒能寫進手冊（儲存失敗），請先匯出備份'); }
  },
  async get(store, k) {
    if (this.mode === 'mem') return this.mem[store].get(k);
    try { return await this._tx(store, 'readonly', os => os.get(k)); } catch (e) { return this.mem[store].get(k); }
  },
  async all(store) {
    if (this.mode === 'mem') return [...this.mem[store].values()];
    try { return await this._tx(store, 'readonly', os => os.getAll()); } catch (e) { return [...this.mem[store].values()]; }
  },
  async del(store, k) {
    this.mem[store].delete(k);
    if (this.mode === 'mem') return;
    try { await this._tx(store, 'readwrite', os => os.delete(k)); } catch (e) { this.failed = true; }
  }
};

/* 預期風味提示：葡萄栽培的一般原則，僅供對照；不納入完整度與老師版命中率 */
function vwHints(v) {
  const o = [];
  if (v.temp === '偏熱') o.push('偏熱的年份：葡萄成熟快，酸度傾向偏低、酒精偏高，果味偏成熟（成熟水果、黑色水果、熱帶水果）。');
  if (v.temp === '偏冷') o.push('偏冷的年份：成熟慢，酸度傾向偏高、酒精偏低，果味偏青綠（綠色水果、柑橘、紅色水果），單寧可能較青澀。');
  if (v.rain === '多雨') o.push('多雨：果實容易被稀釋、風味較淡，也要留意病害（黴菌）風險。');
  if (v.rain === '少雨') o.push('少雨：果粒較小、風味較濃縮；缺水過頭時葡萄會停止成熟。');
  const ev = arr(v.events);
  if (ev.includes('春霜')) o.push('春霜：新芽受凍，產量通常大減，存活的果實會比較濃縮。');
  if (ev.includes('冰雹')) o.push('冰雹：果實受傷、產量下降，傷口易生病害，酒可能不夠純淨。');
  if (ev.includes('乾旱')) o.push('乾旱：果粒小、皮厚，單寧與風味較濃，酸度偏低；嚴重時成熟停滯。');
  if (ev.includes('熱浪')) o.push('熱浪：果實曬傷或萎縮，酸度快速下降、酒精升高，容易出現煮熟水果或果乾的味道。');
  if (ev.includes('病害')) o.push('病害：風味可能不純淨（黴味、土味），產量下降；貴腐是甜酒的例外。');
  if (ev.includes('日照不足')) o.push('日照不足：成熟度不夠，偏青澀、酸高、酒體較輕。');
  if (ev.includes('開花期惡劣天氣')) o.push('開花期惡劣天氣：落花落果，產量減少，果串不整齊（成熟度不一）。');
  if (ev.includes('野火')) o.push('野火：煙燻味可能附著在果皮上，酒中出現煙燻、灰燼的異味（煙燻汙染）。');
  if (v.harvest === '早') o.push('收穫較早：多半是熱年，成熟快，酸度低、酒精高。');
  if (v.harvest === '晚') o.push('收穫較晚：多半是涼年，成熟慢，酸度保留得較好、香氣較細緻。');
  if (v.hrain === '收穫期有下雨') o.push('收穫期下雨：果實吸水稀釋，風味變淡，也增加黴菌風險。');
  if (v.yield === '少') o.push('產量少：每顆果實分到的養分多，風味較濃縮。');
  if (v.yield === '多') o.push('產量多：若沒有疏果，風味容易被稀釋。');
  if (v.ripe === '未熟') o.push('成熟度不足：青澀、酸高，單寧生硬。');
  if (v.ripe === '過熟') o.push('過熟：果醬或煮熟水果味、酒精高、酸度低，結構可能鬆散。');
  return o;
}

  try {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
    const w0 = bmp.width, h0 = bmp.height, s = Math.min(1, 1600 / Math.max(w0, h0));

}

async function buildExport() {
  const phs = await Store.all('photos'); const photos = [];
  for (const p of phs) { try { photos.push({ id: p.id, dataUrl: await blobToDataURL(p.blob) }); } catch (e) {} }
  return { app: APP_ID, schemaVersion: SCHEMA, exportedAt: new Date().toISOString(), settings: { mode: S.mode, l3Vocab: !!S.l3Vocab, l3Cat: S.l3Cat || {}, showTodo: S.showTodo !== false, defLvl: S.defLvl || 2 }, vintageOverrides: JSON.parse(JSON.stringify(refOv)), wines: JSON.parse(JSON.stringify(wines)), photos };
}
async function doImport(text) {
  const data = JSON.parse(text);
  if (!data || data.app !== APP_ID || !Array.isArray(data.wines)) throw new Error('這不是本 App 的備份檔');
  if (Number(data.schemaVersion) > SCHEMA) throw new Error('這份備份來自較新版本的 App，請先更新 App 再匯入');
  let added = 0, updated = 0, skipped = 0, ov = 0;
  for (const p of arr(data.photos)) { try { await Store.put('photos', { id: p.id, blob: dataURLToBlob(p.dataUrl), type: 'image/jpeg' }); } catch (e) {} }
  for (const raw of data.wines) {
    const w = normalizeWine(raw); const ex = wines.find(x => x.id === w.id);
    if (!ex) { wines.push(w); await Store.put('wines', w); added++; }
    else if ((w.updatedAt || 0) > (ex.updatedAt || 0)) { wines[wines.indexOf(ex)] = w; await Store.put('wines', w); updated++; }
    else skipped++;
  }
  if (data.vintageOverrides && typeof data.vintageOverrides === 'object') {
    for (const k in data.vintageOverrides) { const o = data.vintageOverrides[k]; if (o && typeof o === 'object' && (!refOv[k] || (o.at || 0) > (refOv[k].at || 0))) { refOv[k] = o; ov++; } }
    if (ov) await saveRefOv();
  }
  return { added, updated, skipped, ov };
}
